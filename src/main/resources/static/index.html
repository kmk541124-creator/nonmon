<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nonmon · 문서 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f2ea;
    --card: #fffdf8;
    --ink: #22201c;
    --muted: #7a746a;
    --line: #e4ddd0;
    --accent: #c2410c;
    --accent-soft: #fdecdf;
    --good: #15803d;
    --good-soft: #e3f3e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 16px 80px; }

  header { margin-bottom: 32px; }
  header h1 {
    font-family: "Noto Serif KR", serif;
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin: 4px 0 0; }

  .drop {
    border: 2px dashed var(--line);
    border-radius: 14px;
    background: var(--card);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 1.05rem; }
  .drop small { color: var(--muted); }
  .drop .file-name { margin-top: 12px; font-weight: 500; color: var(--accent); }
  #fileInput { display: none; }

  .actions { display: flex; gap: 12px; margin-top: 16px; align-items: center; }
  button {
    font: inherit;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .status { color: var(--muted); font-size: .95rem; }
  .status.error { color: #b91c1c; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { display: none; margin-top: 40px; }
  .section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .section h2 {
    font-family: "Noto Serif KR", serif;
    font-size: 1.2rem;
    margin: 0 0 12px;
  }
  .section h2 .count {
    font-family: "Noto Sans KR", sans-serif;
    font-size: .85rem; font-weight: 500;
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 10px; border-radius: 99px; margin-left: 8px;
  }
  .section p { margin: 0; white-space: pre-wrap; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: .85rem; color: var(--muted); font-weight: 500; }
  td.wrong { color: #b91c1c; text-decoration: line-through; text-decoration-color: rgba(185,28,28,.5); }
  td.right { color: var(--good); font-weight: 500; }
  td.arrow { color: var(--muted); width: 32px; text-align: center; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>non<span>mon</span></h1>
    <p>문서를 올리면 요약, 개선 방향, 맞춤법 오류를 분석합니다.</p>
  </header>

  <label class="drop" id="drop">
    <strong>파일을 끌어다 놓거나 클릭해서 선택하세요</strong>
    <small>PDF, Word(.docx), 한글 텍스트 등 · 최대 20MB</small>
    <div class="file-name" id="fileName"></div>
    <input type="file" id="fileInput">
  </label>

  <div class="actions">
    <button id="analyzeBtn" disabled>분석하기</button>
    <span class="status" id="status"></span>
  </div>

  <div id="result">
    <div class="section">
      <h2>요약</h2>
      <p id="check"></p>
    </div>
    <div class="section">
      <h2>개선 방향</h2>
      <p id="feature"></p>
    </div>
    <div class="section">
      <h2>맞춤법 <span class="count" id="matCount"></span></h2>
      <div id="mat"></div>
    </div>
  </div>
</div>

<script>
  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("fileInput");
  const fileName = document.getElementById("fileName");
  const analyzeBtn = document.getElementById("analyzeBtn");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");

  let selectedFile = null;

  function selectFile(file) {
    selectedFile = file;
    fileName.textContent = file ? file.name : "";
    analyzeBtn.disabled = !file;
  }

  fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

  drop.addEventListener("dragover", (e) => {
    e.preventDefault();
    drop.classList.add("over");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    selectFile(e.dataTransfer.files[0]);
  });

  analyzeBtn.addEventListener("click", async () => {
    const formData = new FormData();
    formData.append("file", selectedFile);

    analyzeBtn.disabled = true;
    statusEl.className = "status";
    statusEl.innerHTML = '<span class="spinner"></span>분석 중입니다. 문서 길이에 따라 시간이 걸릴 수 있습니다.';
    result.style.display = "none";

    try {
      const res = await fetch("/api/documents/analyze", {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        throw new Error("서버 오류 (" + res.status + ")");
      }

      const data = await res.json();
      showResult(data);
      statusEl.textContent = "분석이 끝났습니다.";
    } catch (err) {
      statusEl.className = "status error";
      statusEl.textContent = "분석에 실패했습니다: " + err.message;
    } finally {
      analyzeBtn.disabled = false;
    }
  });

  function showResult(data) {
    document.getElementById("check").textContent = data.check || "결과 없음";
    document.getElementById("feature").textContent = data.feature || "결과 없음";

    const list = data.mat || [];
    document.getElementById("matCount").textContent = list.length + "개";

    const matEl = document.getElementById("mat");
    if (list.length === 0) {
      matEl.innerHTML = '<p class="empty">발견된 맞춤법 오류가 없습니다.</p>';
    } else {
      const table = document.createElement("table");
      table.innerHTML = "<tr><th>틀린 표현</th><th></th><th>올바른 표현</th></tr>";
      list.forEach((item) => {
        const row = table.insertRow();
        row.insertCell().textContent = item.wrong;
        row.insertCell().textContent = "→";
        row.insertCell().textContent = item.right;
        row.cells[0].className = "wrong";
        row.cells[1].className = "arrow";
        row.cells[2].className = "right";
      });
      matEl.innerHTML = "";
      matEl.appendChild(table);
    }

    result.style.display = "block";
  }
</script>
</body>
</html>
